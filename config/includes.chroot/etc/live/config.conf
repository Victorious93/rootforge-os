# RootForge OS — live session configuration
# Victorious Framework | Origin Source Labs
#
# live-config reads this at boot to configure the live session.
# https://manpages.debian.org/bookworm/live-config-doc/live-config.7.en.html

# Live user account name and full name
LIVE_USERNAME="rootforge"
LIVE_USER_FULLNAME="RootForge OS Live"
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev bluetooth scanner kvm docker"

# Hostname shown in the live session
LIVE_HOSTNAME="rootforge-live"

# Timezone — sensible default, Calamares prompts to change during install
LIVE_TIMEZONE="UTC"

# Locale
LIVE_LOCALES="en_US.UTF-8"
LIVE_KEYBOARD_LAYOUTS="us"
