# RootForge OS — tmux baseline config
# Victorious Framework | Origin Source Labs
# setup_terminal.sh appends a RootForge block below this baseline.

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1

# Dark terminal aesthetic
set -g status-style bg=black,fg=colour2
set -g status-left "#[bold]  RootForge  #[default]"
set -g status-right "#[fg=colour6]#(adb devices 2>/dev/null | grep -c device$) dev#[default]  %H:%M"
set -g status-right-length 40

# Vi keys in copy mode
setw -g mode-keys vi

# Quick reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Intuitive splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
