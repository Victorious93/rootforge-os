# RootForge OS — enable os-prober for dual-boot detection
# Victorious Framework | Origin Source Labs
#
# Debian 12 ships with os-prober disabled by default in GRUB.
# This enables it so an existing OS (Ubuntu, Windows, etc.) on the same disk
# appears in the GRUB boot menu after a side-by-side install — matching
# Ubuntu's dual-boot detection behaviour (README section 14).
#
# Known rough edge: os-prober re-scanning at every `update-grub` can
# occasionally reorder entries on multi-OS systems. If the boot menu
# looks wrong after installing, run `sudo update-grub` to rescan.
GRUB_DISABLE_OS_PROBER=false
