# RootForge OS — Calamares shellprocess module (post-install first-boot enable)
# Victorious Framework | Origin Source Labs
#
# [Likely] this matches Calamares's shellprocess module schema — the module
# itself is a well-established, standard part of Calamares, but the exact
# YAML shape has shifted across releases; verify against the actual
# calamares-settings-debian version installed if this step errors.
#
# Replaces config/hooks/normal/0050-firstboot-enable.hook.chroot, which
# never actually ran: live-build's own hook discovery only looks at
# config/hooks/*.chroot (a flat, non-recursive glob — confirmed against
# the installed live-build package's Find_files/lb_chroot_hooks logic), so
# a hook nested under config/hooks/normal/ was invisible to it regardless
# of "normal" vs "live" naming, which isn't a live-build hook convention
# this version understands at all. Calamares has no equivalent "run
# config/hooks/normal/*" convention either — shellprocess, run chrooted
# into the real install target during the exec sequence, is the correct
# integration point for exactly this: enabling a systemd unit only on the
# installed system, never on the live squashfs.

---
dontChroot: false
timeout: 30

command:
  - "touch /etc/rootforge-installed"
  - "systemctl enable rootforge-firstboot.service"
