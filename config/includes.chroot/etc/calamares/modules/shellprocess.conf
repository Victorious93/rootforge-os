---
# Runs inside the installed system (dontChroot: false). ${USER} is the login
# name entered on the user page; Calamares validates it, and the provisioning
# script validates it again before use.
dontChroot: false
timeout: 30
command:
  - "touch /etc/rootforge-installed"
  # The live user's passwordless sudo rule. The installed user gets ordinary
  # sudo through the "sudo" group; this rule must not survive the install.
  - "rm -f /etc/sudoers.d/rootforge-live"
  # The identity first-boot provisioning works for. Nothing may guess it: the
  # service has no login user, and "the first UID" or $SUDO_USER can be wrong.
  - "install -d -m 0755 /var/lib/rootforge"
  - "sh -c \"printf '%s\\n' '${USER}' > /var/lib/rootforge/install-user\""
  - "systemctl enable rootforge-firstboot.service"
