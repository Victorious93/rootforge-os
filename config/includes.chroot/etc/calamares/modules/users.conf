# RootForge OS — Calamares users module
# Victorious Framework | Origin Source Labs

---
userGroup:    users
defaultGroups:
  - adm
  - cdrom
  - sudo
  - dip
  - plugdev
  - kvm
  - docker
  - lpadmin

# Autologin is off by default — this is a dev box, not a kiosk
autologinGroup: autologin
doAutologin:    false

sudoersGroup:         sudo
setRootPassword:      true
doReusePassword:      false
passwordRequirements:
  minLength: 6

avatarFilePath: ~/.face

# The live session's account is "rootforge" (etc/live/config.conf) and
# removeuser.conf deletes that name from the installed system. If the person
# installing could also choose "rootforge", that cleanup would delete the
# account they just created, so the name is forbidden here.
user:
  shell: /bin/bash
  forbidden_names: [ root, rootforge ]
  home_permissions: "o700"
