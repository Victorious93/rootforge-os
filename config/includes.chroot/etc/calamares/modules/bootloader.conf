# RootForge OS — Calamares bootloader module config
# Victorious Framework | Origin Source Labs
#
# UEFI primary target (grub-efi-amd64), BIOS legacy secondary.
# os-prober enabled via /etc/default/grub.d/rootforge-os-prober.cfg
# so dual-boot entries survive update-grub after install.

---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
fallback: "/initrd.img"
timeout: 10
grubInstall: "grub-install"
grubMkconfig: "update-grub"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
