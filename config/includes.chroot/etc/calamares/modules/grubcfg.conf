# RootForge OS — Calamares grubcfg module
# Victorious Framework | Origin Source Labs
#
# Sets GRUB defaults for the installed system.
# os-prober is enabled via /etc/default/grub.d/rootforge-os-prober.cfg
# (that drop-in is copied to the installed system by unpackfs).

---
grubInstall:  grub-install
grubMkconfig: update-grub
grubCfg:      /boot/grub/grub.cfg

defaults:
  GRUB_TIMEOUT:           10
  GRUB_DISTRIBUTOR:       "RootForge OS"
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"
  GRUB_CMDLINE_LINUX:     ""
