# RootForge OS — Calamares packages module (post-install cleanup)
# Victorious Framework | Origin Source Labs
#
# Remove live-session-only packages that have no place on an installed system.

---
backend: apt

operations:
  - remove:
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
    - live-tools
    - calamares
    - calamares-settings-debian
