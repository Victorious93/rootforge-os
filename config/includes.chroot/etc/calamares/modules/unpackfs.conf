# RootForge OS — Calamares unpackfs module config
# Victorious Framework | Origin Source Labs
#
# Points Calamares at the live squashfs to unpack during disk install.
# Path matches where live-build places the filesystem image.

---
unpack:
  - source: /run/live/medium/live/filesystem.squashfs
    sourcefs: squashfs
    destination: ""
