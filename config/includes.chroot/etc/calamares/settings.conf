# RootForge OS — Calamares settings
# Victorious Framework | Origin Source Labs
#
# Drives the installer module sequence. Based on calamares-settings-debian
# (installed as a package) for proven partition/bootloader logic.

---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - grubcfg
    - bootloader
    - packages
    - luksbootkeyfile
    - plymouthcfg
    - initramfscfg
    - initramfs
    - shellprocess
    - removeuser
    - umount
  - show:
    - finished

branding: rootforge

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
