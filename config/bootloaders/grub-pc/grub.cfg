if loadfont /boot/grub/font.pf2 ; then
  set gfxmode=auto
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set default=0
set timeout=10

menuentry "RootForge OS — Live Session" {
    linux   /live/vmlinuz boot=live components quiet splash
    initrd  /live/initrd.img
}

menuentry "RootForge OS — Live Session (safe graphics)" {
    linux   /live/vmlinuz boot=live components nomodeset
    initrd  /live/initrd.img
}

menuentry "RootForge OS — Install to Disk" {
    linux   /live/vmlinuz boot=live components quiet splash calamares=yes
    initrd  /live/initrd.img
}

menuentry "RootForge OS — Live (RAM copy, remove media after boot)" {
    linux   /live/vmlinuz boot=live components toram quiet splash
    initrd  /live/initrd.img
}
