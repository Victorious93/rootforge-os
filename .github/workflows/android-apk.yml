# RootForge OS — Android host-phone APK
#
# Builds a debug APK on every PR/push that touches the app, runs the
# hermetic unit tests (protocol + Paparazzi), and uploads the APK. A
# release APK is produced only when signing secrets are present; missing
# secrets are not a failure.

name: Android APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google no longer serves the obsolete `tools` package; v3 still
          # defaults to installing it and fails with "Failed to find package 'tools'".
          packages: 'platform-tools'

      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rootforge-os-android-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Paparazzi screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rootforge-os-android-screenshots
          path: |
            android-app/screenshots/*.png
            android-app/app/src/test/snapshots/images/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Decode the release keystore
        id: keystore
        if: ${{ secrets.ROOTFORGE_KEYSTORE_BASE64 != '' }}
        env:
          B64: ${{ secrets.ROOTFORGE_KEYSTORE_BASE64 }}
        run: |
          echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Release APK
        if: steps.keystore.outputs.file != ''
        env:
          ROOTFORGE_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ROOTFORGE_KEYSTORE_PASSWORD: ${{ secrets.ROOTFORGE_KEYSTORE_PASSWORD }}
          ROOTFORGE_KEY_ALIAS: ${{ secrets.ROOTFORGE_KEY_ALIAS }}
          ROOTFORGE_KEY_PASSWORD: ${{ secrets.ROOTFORGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: steps.keystore.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: rootforge-os-android-release
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
