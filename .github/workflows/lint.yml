# RootForge OS — lint pipeline
# Victorious Framework | Origin Source Labs
#
# Fast, PR-time checks that catch a specific class of bug the hard way:
# release.yml's first real run (see PRs #3/#4) failed on things that took
# an hour of GitHub Actions time to surface — invalid lb config flags, a
# renamed Debian package (simg2img -> android-sdk-libsparse-utils), apt
# packages that were never actually in Debian's repos (eza, starship) — all
# of which this catches in under a minute instead. It complements
# release.yml rather than replacing it: things that only break during an
# actual live-build run (the auto/build pipefail bug, the dead grub-pc
# template path) still need a real build to catch.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint sweep
        # tests/lint.sh is the same script `make lint` runs, so a
        # contributor's local check and this job cannot drift apart. It
        # selects scripts by shebang rather than by a '*.sh' glob — the
        # `rootforge` and `brain` entrypoints have no extension and were
        # never checked at all under the old name-based selection — and it
        # byte-compiles the shipped Python, which this pipeline never did.
        run: tests/lint.sh

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML
        # Plain yaml.safe_load() silently accepts duplicate mapping keys
        # (keeps the last one, no error) even though the YAML spec — and
        # GitHub's own workflow parser — reject them. release.yml's first
        # real run failed on exactly that (a duplicate if-no-files-found:
        # under one step) with zero jobs even scheduled, and this check
        # passed anyway. Use a loader that raises on duplicates instead.
        run: |
          python3 -c "
          import glob, sys
          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f'duplicate key {key!r}')
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping
          )

          bad = False
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.load(open(f), Loader=UniqueKeyLoader)
                  print(f'{f}: OK')
              except Exception as e:
                  print(f'{f}: FAILED - {e}')
                  bad = True
          sys.exit(1 if bad else 0)
          "

  package-lists:
    runs-on: ubuntu-latest
    container: debian:bookworm
    # Container-job steps default to the container's own /bin/sh (dash in
    # debian:bookworm), not bash — `set -o pipefail` below is a bashism and
    # fails immediately under dash ("Illegal option -o pipefail") without
    # this. bash is part of Debian's Priority:required set, so it's present
    # in the base image without an extra install step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: apt-get update
        run: apt-get update -qq

      - name: Verify every listed package resolves on bookworm
        run: |
          set -euo pipefail
          MISSING=0
          for f in config/package-lists/*.list.chroot termux/package-lists/*.list.chroot; do
            echo "== $f =="
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              if ! apt-cache show "$pkg" >/dev/null 2>&1; then
                echo "MISSING: $pkg (in $f)"
                MISSING=1
              fi
            done < <(grep -v '^#' "$f" | grep -v '^[[:space:]]*$')
          done
          exit "$MISSING"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the RootForge test suite
        # Hermetic: stubbed adb/fastboot, no device, no network, no Docker.
        # See tests/README.md.
        run: tests/run-tests.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the CLI responds
        run: |
          set -euo pipefail
          export PYTHONPATH=config/includes.chroot/usr/local/lib
          python3 -m rootforge.core.cli --version
          python3 -m rootforge.core.cli --help > /dev/null
          # doctor exits non-zero on a runner with no adb/fastboot, which is
          # correct behavior — assert it runs and reports, not that it passes.
          python3 -m rootforge.core.cli doctor --json | python3 -c "import json,sys; json.load(sys.stdin)"
