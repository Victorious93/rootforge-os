# RootForge OS — release pipeline
# Victorious Framework | Origin Source Labs
#
# Builds the amd64 installable/USB-flashable ISO and the Termux/PRoot rootfs
# tarballs (arm64 + amd64) and attaches them, with sha256 checksums, to a
# draft GitHub Release — so both delivery paths (ISO and Termux rootfs; see README)
# have real, downloadable artifacts instead of requiring every user to build
# from source. The ISO/rootfs release is left as a draft; a maintainer publishes
# it after a sanity check.
#
# Independently of the ISO path, a debug host-phone APK is built and attached
# to a published (non-draft) GitHub Release for the same tag. The APK artifact
# is not named rootforge-* so the ISO verifier never sees it. Desktop/Docker
# stay on toolkit.yml (7-day CI artifacts). A release-signed APK is produced
# only when ROOTFORGE_KEYSTORE_* secrets exist (android-apk.yml); this job
# always attaches the debug APK so a tag has a permanent download link.
#
# [Likely] this needs at least one real run to shake out runner-specific
# issues (disk space during the live-build stage, binfmt_misc registration
# for the cross-arch debootstrap) — it hasn't been exercised on GitHub's
# infrastructure from this repo, only reasoned through against BUILD.md's
# documented requirements and termux/build-rootfs.sh's own prerequisites.
#
# Triggers on a `v*` tag push (creates/updates the draft release for that
# tag) or manually via workflow_dispatch (builds and uploads artifacts for
# inspection without touching Releases, since a manual run may not have a
# tag ref).
#
# Nothing is built unless lint.yml's checks (shellcheck, YAML, package lists,
# the test suite, the CLI smoke test) pass on the same commit, and nothing is
# attached to a release until the install metadata has been generated from the
# real artifacts and tests/verify-release-assets.sh has accepted the whole set.
# The Termux install files (install.sh, the proot-distro plugin) are generated
# per release by termux/make-release-metadata.sh; there is no checked-in copy
# with placeholder digests.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  checks:
    # The same workflow PRs run, on the commit being released.
    uses: ./.github/workflows/lint.yml

  build-iso:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (live-build needs ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils

      - name: Confirm a loop device is available
        run: |
          sudo losetup -f
          sudo modprobe loop || true

      - name: Build ISO
        run: sudo auto/build

      - name: Checksum
        run: make checksum

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootforge-os-amd64-iso
          path: |
            rootforge-os-amd64.hybrid.iso
            rootforge-os-amd64.hybrid.iso.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log (always, even on failure)
        # A failed `Build ISO` step only shows a handful of echo lines in
        # the GitHub UI/API — the real live-build trace is in this file.
        # Uploading it unconditionally is what makes a failure here
        # diagnosable without re-running the whole build.
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          # Not named rootforge-*: the release job downloads rootforge-* only,
          # so a build log can never be published as a release asset.
          name: build-log-iso
          path: rootforge-build-*.log
          retention-days: 7
          if-no-files-found: ignore

  # Debug APK is attached even when live-build / rootfs fails. Artifact name
  # must not match rootforge-* (the ISO release job downloads that pattern).
  build-apk:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-host-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  attach-apk:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-host-debug-apk
          path: apk-assets

      - name: Stable asset name and checksum
        run: |
          set -euo pipefail
          cd apk-assets
          src="$(ls ./*.apk)"
          mv "$src" rootforge-os-android-debug.apk
          sha256sum rootforge-os-android-debug.apk > rootforge-os-android-debug.apk.sha256

      - name: Attach APK to a published release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apk-assets/rootforge-os-android-debug.apk
            apk-assets/rootforge-os-android-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-termux-rootfs:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        # proot = unrooted device (ptrace emulation), chroot = rooted device
        # (real chroot via su). Their rootfs contents differ — see
        # termux/build-rootfs.sh's --flavor — so they are separate artifacts,
        # not one tarball used two ways.
        flavor: [proot, chroot]
    steps:
      - uses: actions/checkout@v4

      - name: Install debootstrap + qemu-user-static
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static binfmt-support

      - name: Build rootfs (${{ matrix.arch }}, ${{ matrix.flavor }})
        run: sudo termux/build-rootfs.sh ${{ matrix.arch }} dist --flavor ${{ matrix.flavor }}

      - name: Rename to a stable asset name
        # termux/build-rootfs.sh timestamps its output for safe repeated
        # local builds; the proot-distro plugin's TARBALL_URL points at a
        # fixed filename under releases/latest/download/, so the release
        # asset needs that fixed name instead of the timestamped one.
        run: |
          cd dist
          src="$(ls rootforge-${{ matrix.flavor }}-${{ matrix.arch }}-*.tar.xz)"
          name="rootforge-${{ matrix.flavor }}-${{ matrix.arch }}.tar.xz"
          mv "$src" "$name"
          rm -f "$src.sha256"
          # The sidecar names the file it covers, so it must be regenerated
          # under the stable name for `sha256sum -c` to work for users.
          sha256sum "$name" > "$name.sha256"

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootforge-${{ matrix.flavor }}-${{ matrix.arch }}
          path: |
            dist/rootforge-${{ matrix.flavor }}-${{ matrix.arch }}.tar.xz
            dist/rootforge-${{ matrix.flavor }}-${{ matrix.arch }}.tar.xz.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [build-iso, build-termux-rootfs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq xz-utils

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: rootforge-*
          merge-multiple: true

      - name: Generate install metadata from the real artifacts
        # Binds this tag, each architecture and flavor, the download URL and
        # the SHA-256 together; fails if a tarball is missing, mismatched or
        # not what its name says. Also publishes the launcher it pins.
        # bash: the script was 100644 (not executable). Tag v0.2.0's release
        # job failed here with "Permission denied" after ISO + four rootfs
        # builds had already succeeded (run 38682276372). Tests already call
        # it with bash.
        run: bash termux/make-release-metadata.sh --tag "$GITHUB_REF_NAME" --dist release-assets --out release-assets

      - name: Add the ISO to SHA256SUMS
        run: |
          cd release-assets
          sha256sum -c rootforge-os-amd64.hybrid.iso.sha256
          cat rootforge-os-amd64.hybrid.iso.sha256 >> SHA256SUMS

      - name: Verify the release assets
        run: tests/verify-release-assets.sh release-assets --tag "$GITHUB_REF_NAME"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
