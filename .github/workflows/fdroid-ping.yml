# Ask Victorious93/fleet-fdroid to rebuild its F-Droid index when a release is published.
# Needs the FDROID_DISPATCH_TOKEN secret (fine-grained PAT, Contents: read & write on fleet-fdroid).
# Without the secret it prints a notice and exits 0; it never fails CI.
name: Notify fleet-fdroid

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to report (optional; defaults to the ref name)"
        required: false
        default: ""

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify fleet-fdroid
        env:
          FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          if [ -z "${FDROID_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::FDROID_DISPATCH_TOKEN is not set; skipping fleet-fdroid refresh."
            exit 0
          fi
          payload="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" \
            '{event_type: "new-release", client_payload: {repo: $repo, tag: $tag}}')"
          code="$(curl -sS -o /tmp/fdroid-resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${FDROID_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Victorious93/fleet-fdroid/dispatches \
            -d "$payload" || echo 000)"
          if [ "$code" = "204" ]; then
            echo "Sent new-release ($GITHUB_REPOSITORY $TAG) to Victorious93/fleet-fdroid."
          else
            echo "::warning::fleet-fdroid dispatch returned HTTP $code: $(cat /tmp/fdroid-resp 2>/dev/null)"
          fi
